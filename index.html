<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria - Menu</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header>
      <h1>Pizzeria da Gino</h1>
      <p>il nostro menu</p>
    </header>

    <div class="menu">

      <div class="sezione" id="pizze">
        <h2>Pizze</h2>
        <div class="item">
          <img src="img/pizza1.jpg" alt="Margherita">
          <div class="descrizione">
            <h3>Margherita</h3>
            <p>Pomodoro, mozzarella fior di latte, basilico</p>
          </div>
          <span class="prezzo">€ 6,00</span>
        </div>
        <div class="item">
          <img src="img/pizza2.jpg" alt="Diavola">
          <div class="descrizione">
            <h3>Diavola</h3>
            <p>Pomodoro, mozzarella, salame piccante</p>
          </div>
          <span class="prezzo">€ 7,50</span>
        </div>
      </div>

      <div class="sezione" id="dolci">
        <h2>Dolci</h2>
      </div>

      <div class="sezione" id="bevande">
        <h2>Bevande</h2>
        <div class="item">
          <img src="img/caffe.jpg" alt="Caffè Espresso">
          <div class="descrizione">
            <h3>Caffè Espresso</h3>
            <p>Miscela 100% arabica</p>
          </div>
          <span class="prezzo">€ 1,20</span>
        </div>
      </div>

    </div>

    <footer>
      <p>Pizzeria da Gino - Via Roma 12 - tel. 02 1234567</p>
    </footer>
  </body>
</html>
